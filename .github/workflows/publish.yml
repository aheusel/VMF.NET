name: Publish NuGet & Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # softprops/action-gh-release creates the release
  id-token: write   # OIDC token for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./nupkgs /p:Version=${GITHUB_REF_NAME#v}

    # Exchanges the job's OIDC token for a NuGet API key valid for 1 hour.
    # Must sit immediately before the push, and the trusted-publishing policy on
    # nuget.org is bound to THIS file's name (publish.yml) - renaming it breaks
    # publishing until the policy is updated to match.
    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Build docs
      run: docfx docfx.json

    - name: Zip docs
      run: cd _site && zip -r ../api-docs.zip .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        generate_release_notes: true
        files: api-docs.zip
